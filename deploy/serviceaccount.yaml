apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-sre
  labels:
    app.kubernetes.io/part-of: aiops-agent
# The gateway pod runs the agent's shell in this pod, so the in-cluster
# credential this ServiceAccount projects is what the agent's `kubectl`
# uses. The aiops-agent-sre ClusterRole bounds everything it can do.
automountServiceAccountToken: true
