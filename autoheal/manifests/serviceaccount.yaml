# Dedicated identity for the autoheal controller. Deliberately separate from
# the assistant's aiops-sre ServiceAccount: the autoheal ClusterRole grants
# mutations the interactive assistant does not have (pods delete, apps patch,
# scale), so the two trust domains stay revocable independently.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autoheal
  labels:
    app: autoheal
    app.kubernetes.io/part-of: aiops-agent
automountServiceAccountToken: true
